      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install provisioning test dependency
        run: python -m pip install requests==2.34.2

      - name: Test provisioning and auth migrations
        run: python -m unittest engine.tests.test_provision_accounts engine.tests.test_auth_trigger -v

      - name: Commit and push shared access branch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/provision-accounts.yml README.md app engine lib supabase
          git diff --cached --check
          git commit -m "Replace individual dashboard accounts with shared password access"
          git push origin HEAD:feat/shared-password-access
