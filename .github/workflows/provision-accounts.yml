name: Provision dashboard accounts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egx-dashboard-account-provisioning
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install provisioning dependency
        run: python -m pip install requests==2.34.2

      - name: Test account provisioning
        run: python -m unittest engine.tests.test_provision_accounts engine.tests.test_auth_trigger -v

      - name: Create missing allowlisted accounts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m engine.provision_accounts
