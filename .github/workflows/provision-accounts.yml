name: Apply shared dashboard access

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-access-production-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production feature branch
        run: git checkout -B feat/shared-password-access

      - name: Decode shared access patch
        run: |
          base64 -d .github/shared-access.patch.b64 > /tmp/shared-access.patch
          test -s /tmp/shared-access.patch
          git apply --check /tmp/shared-access.patch
          git apply /tmp/shared-access.patch

      - name: Remove temporary deployment files
        run: rm .github/shared-access.patch.b64 .github/provision-accounts.final.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install provisioning test dependency
        run: python -m pip install requests==2.34.2

      - name: Test provisioning and auth migrations
        run: python -m unittest engine.tests.test_provision_accounts engine.tests.test_auth_trigger -v

      - name: Commit and push shared access branch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/shared-access.patch.b64 .github/provision-accounts.final.yml README.md app engine lib supabase
          git diff --cached --check
          git commit -m "Replace individual dashboard accounts with shared password access"
          git push origin HEAD:feat/shared-password-access
