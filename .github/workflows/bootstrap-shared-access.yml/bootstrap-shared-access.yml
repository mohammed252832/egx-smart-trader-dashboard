name: Bootstrap shared dashboard access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout shared access implementation
        uses: actions/checkout@v4
        with:
          repository: mohammedfathi2532-code/egx-smart-trader
          ref: feat/shared-password-access

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install provisioning dependency
        run: python -m pip install requests==2.34.2

      - name: Test account provisioning
        run: python -m unittest engine.tests.test_provision_accounts engine.tests.test_auth_trigger -v

      - name: Configure and verify shared dashboard account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SHARED_PASSWORD: ${{ secrets.DASHBOARD_SHARED_PASSWORD }}
        run: python -m engine.provision_accounts
