name: Configure shared dashboard access

on:
  workflow_dispatch:
    inputs:
      remove_legacy_accounts:
        description: Delete the three legacy dashboard accounts after configuring shared access
        required: false
        type: boolean
        default: false
      verify_live_login:
        description: Verify shared password login against the deployed dashboard before any legacy deletion
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: egx-dashboard-account-provisioning
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install provisioning dependency
        run: python -m pip install requests==2.34.2

      - name: Test account provisioning
        run: python -m unittest engine.tests.test_provision_accounts engine.tests.test_auth_trigger -v

      - name: Configure shared dashboard account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SHARED_PASSWORD: ${{ secrets.DASHBOARD_SHARED_PASSWORD }}
          REMOVE_LEGACY_ACCOUNTS: ${{ inputs.remove_legacy_accounts }}
          VERIFY_LIVE_LOGIN: ${{ inputs.verify_live_login }}
          DASHBOARD_URL: https://egx-smart-trader-dashboard.vercel.app
        run: |
          if [ -z "$SUPABASE_SHARED_PASSWORD" ]; then
            echo "DASHBOARD_SHARED_PASSWORD secret is required" >&2
            exit 1
          fi
          args=()
          if [ "$REMOVE_LEGACY_ACCOUNTS" = "true" ]; then
            args+=(--remove-legacy)
          fi
          if [ "$VERIFY_LIVE_LOGIN" = "true" ]; then
            args+=(--verify-live-login)
          fi
          python -m engine.provision_accounts "${args[@]}"
